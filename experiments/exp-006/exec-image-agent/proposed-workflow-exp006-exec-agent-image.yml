# Proposed for owner review; not yet authorized to run. INACTIVE COPY: the owner moves it to
# .github/workflows/exp006-exec-agent-image.yml in an owner-operated commit (agent token has no `workflow` scope).
#
# EXP-006 stage 3: build the agent execution image (the stage-2 exec image plus Claude Code 2.1.323, python3-minimal
# and the agent entrypoint), smoke-test it over SSH/PTY with the real stage-2 client and NO egress and NO API key,
# then push it to GHCR. Inert until this file is on the default branch AND the owner dispatches it
# (workflow_dispatch only: no push or pull_request trigger).
#
# Source pinning: a workflow_dispatch run executes the workflow file from main, but this job builds from the
# pinned, reviewed SOURCE_SHA, not from main or any branch. That commit contains experiments/exp-006/exec-image-agent/
# (Containerfile, entrypoint-agent.sh, exp006-status, smoke-agent.sh) and experiments/exp-006/local/agent-task/repo.
# Any change to the build context needs a new source commit and an updated SOURCE_SHA. A step fails the job unless
# the checked-out HEAD equals SOURCE_SHA, and the job refuses a SOURCE_SHA that is not a 40-hex commit.
#
# Order: build, smoke-agent.sh, and only then GHCR login and push. A smoke failure stops the job and nothing is
# published. Auth is the repository-scoped GITHUB_TOKEN; no PATs. No Anthropic key exists in this workflow. The
# pushed digest, not the tag, is what the manifests pin. Package visibility is NOT changed here (the stage-2 package
# `herdrnetes-exec` is already PUBLIC; this tag is added to the same package).
name: exp006-exec-agent-image

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: exp006-exec-agent-image
  cancel-in-progress: false

env:
  SOURCE_SHA: __SOURCE_SHA__
  IMAGE: ghcr.io/jlaska/herdrnetes-exec
  TAG: exp006-s3
  CONTEXT: experiments/exp-006
  CONTAINERFILE: experiments/exp-006/exec-image-agent/Containerfile
  SMOKE: experiments/exp-006/exec-image-agent/smoke-agent.sh
  # EXP-002 Herdr image: the real stage-2 client (ssh). Public; pulled anonymously.
  CLIENT_IMAGE: ghcr.io/jlaska/herdrnetes-herdr:exp002-h095-c311@sha256:c5a235ae20ddebd25debeae4cc844a98d854cae5f7d130693958955b37e8d277

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1 (release 2026-07-20); SHA is the commit the tag points to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify the checkout is the pinned source commit
        run: |
          set -eu
          head=$(git rev-parse HEAD)
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "SOURCE_SHA is not a 40-hex commit (placeholder not substituted?)" >&2; exit 1; }
          [ "$head" = "$SOURCE_SHA" ] \
            || { echo "HEAD $head != SOURCE_SHA $SOURCE_SHA" >&2; exit 1; }
          echo "building from $head"

      # Build context is experiments/exp-006 (the Containerfile copies local/agent-task/repo). The Containerfile
      # downloads Claude Code and verifies its sha256, and pulls the public stage-2 base image by digest.
      - name: Build
        run: docker build --file "$CONTAINERFILE" --tag "$IMAGE:$TAG" "$CONTEXT"

      - name: Version and package manifest
        run: |
          set -eu
          docker run --rm --entrypoint /usr/local/bin/claude -e DISABLE_AUTOUPDATER=1 "$IMAGE:$TAG" --version
          docker run --rm --entrypoint /usr/bin/tmux "$IMAGE:$TAG" -V
          docker run --rm --entrypoint /usr/bin/python3 "$IMAGE:$TAG" --version
          docker run --rm --entrypoint /bin/cat "$IMAGE:$TAG" /usr/share/exp006-manifest.txt

      - name: Pull the client image (anonymous, before any login)
        run: docker pull "$CLIENT_IMAGE"

      # Two-container SSH/PTY test on an --internal network with no API key; no registry credentials exist at this
      # point. A failure stops the job, so nothing is published.
      - name: Smoke test (smoke-agent.sh)
        env:
          SMOKE_TABLE_FILE: ${{ runner.temp }}/smoke-table.md
        run: bash "$SMOKE" "$IMAGE:$TAG" "$CLIENT_IMAGE"

      - name: Log in to GHCR (GITHUB_TOKEN)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Push and report digest
        env:
          SMOKE_TABLE_FILE: ${{ runner.temp }}/smoke-table.md
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          docker push "$IMAGE:$TAG" | tee push.log
          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -1)
          [ -n "$digest" ] || { echo "could not read digest from docker push output" >&2; exit 1; }
          {
            echo "### EXP-006 stage 3 agent exec image"
            echo
            echo "- Source SHA (built from): \`$SOURCE_SHA\`"
            echo "- Workflow commit (\`GITHUB_SHA\`, the workflow file's own commit, not the build source): \`$WORKFLOW_COMMIT\`"
            echo "- Tag: \`$IMAGE:$TAG\`"
            echo "- Digest: \`$IMAGE@$digest\`"
            echo "- Client image used by the smoke test: \`$CLIENT_IMAGE\`"
            echo
            echo "Package manifest:"
            echo '```'
            docker run --rm --entrypoint /bin/cat "$IMAGE:$TAG" /usr/share/exp006-manifest.txt
            echo '```'
            echo
            echo "Smoke test (smoke-agent.sh, run before the push):"
            echo
            cat "$SMOKE_TABLE_FILE"
            echo
            echo "**Owner action:** record the digest and source SHA in a reviewed commit to \`k8s/stage3/exec-pod.yaml\` and \`k8s/stage3/RUNBOOK.md\`. The package is already public; confirm that the new tag did not change its visibility."
          } >>"$GITHUB_STEP_SUMMARY"
