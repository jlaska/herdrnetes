apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: herdr
  labels:
    app.kubernetes.io/name: herdr
spec:
  replicas: 1
  serviceName: herdr
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate # one replica: old pod terminates before the new one starts
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: herdr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: herdr
    spec:
      serviceAccountName: herdr
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Measured in scenario B; the Kubernetes default (30 s) is not assumed.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: herdr
          image: herdrnetes-herdr
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /home/herdr
            - name: HERDR_CONFIG_PATH
              value: /etc/herdr/config.toml
            - name: XDG_CONFIG_HOME
              value: /home/herdr/.config
            - name: XDG_STATE_HOME
              value: /run/herdr/state
            - name: XDG_CACHE_HOME
              value: /run/herdr/cache
            - name: TMPDIR
              value: /tmp
            # Owner-generated `claude setup-token`, delivered as a SealedSecret by the
            # GitOps repo. The entrypoint passes it to the server, so every pane sees it
            # (FIND-011); acceptable only for this trusted single-user experiment.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: herdr-claude-token
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Readiness = the server answers on its socket. This is NOT evidence
          # that sessions or agents were restored (measured separately).
          startupProbe:
            exec:
              command: ["herdr", "status", "server"]
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["herdr", "status", "server"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/herdr
            - name: workspace
              mountPath: /workspace
            - name: config
              mountPath: /etc/herdr
              readOnly: true
            - name: run
              mountPath: /run/herdr
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: herdr-config
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
