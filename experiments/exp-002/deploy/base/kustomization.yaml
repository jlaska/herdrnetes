---
# EXP-002 reference manifests (cluster-agnostic), laid out like the private
# GitOps repo's apps (top-level kustomization + config/ + resources/). The
# GitOps copy pins the image by digest; nothing private lives here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: &ns herdrnetes-exp

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: *ns

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: *ns

# Stable ConfigMap name and no reloader annotation: scenario F measures what a
# ConfigMap change does without a forced restart.
configMapGenerator:
  - name: herdr-config
    files:
      - config.toml=config/config.toml

images:
  - name: herdrnetes-herdr
    newName: ghcr.io/jlaska/herdrnetes-herdr
    newTag: exp002-h095-c311

resources:
  - resources
